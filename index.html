  appId:"1:607212105967:web:12bce2ff521ac34b922b1a"
};
/* ================================================================================================ */

if(firebaseConfig.apiKey.startsWith('PASTE')){
  document.getElementById('app').innerHTML='<p><b>Firebase কনফিগ বসানো হয়নি।</b> ফাইলের নিচের দিকে firebaseConfig অংশে আপনার কনফিগ পেস্ট করুন।</p>';
}else{
const fs=getFirestore(initializeApp(firebaseConfig)),au=getAuth(),C=n=>collection(fs,n),D=(n,i)=>doc(fs,n,String(i));
const bail=x=>{document.getElementById('app').innerHTML='<p>ডেটা লোড করা যায়নি ('+(x.code||x.message)+')। Firestore Rules ঠিকমতো বসানো হয়েছে কি না দেখুন।</p>'};
window.FB={
  login:(e,p)=>signInWithEmailAndPassword(au,e,p),
  logout:()=>signOut(au),
  addSub:m=>setDoc(D('subs',m.toLowerCase()),{m,ts:Date.now()}),
  addComment:c=>setDoc(D('comments',c.id),c),
  addMsg:m=>addDoc(C('msgs'),{...m,ts:Date.now()}),
  vote:i=>updateDoc(D('meta','poll'),{['votes.'+i]:increment(1)}),
  react:(id,i)=>updateDoc(D('articles',id),{['rx'+i]:increment(1)}),
  view:id=>updateDoc(D('articles',id),{views:increment(1)}),
  saveArticle:a=>{const {rx,...d}=a;return setDoc(D('articles',a.id),{...d,rx0:rx[0],rx1:rx[1],rx2:rx[2]})},
  delArticle:async(id,cids)=>{const b=writeBatch(fs);b.delete(D('articles',id));cids.forEach(c=>b.delete(D('comments',c)));await b.commit()},
  delComment:id=>deleteDoc(D('comments',id)),
  seedAll:async s=>{const b=writeBatch(fs);s.articles.forEach(a=>{const {rx,...d}=a;b.set(D('articles',a.id),{...d,rx0:0,rx1:0,rx2:0})});
    b.set(D('meta','poll'),{q:s.poll.q,o:s.poll.o.map(x=>x[0]),votes:{0:0,1:0,2:0}});await b.commit()}
};
onSnapshot(C('articles'),s=>{db.articles=s.docs.map(d=>{const x=d.data();x.id=Number(x.id);x.rx=[x.rx0||0,x.rx1||0,x.rx2||0];x.views=x.views||0;return x});
  const first=!loaded;loaded=true;first?route():refresh('articles')},bail);
onSnapshot(C('comments'),s=>{db.comments=s.docs.map(d=>d.data()).sort((a,b)=>a.ts-b.ts);refresh('comments')},bail);
onSnapshot(D('meta','poll'),s=>{const x=s.data();db.poll=x?{q:x.q,o:x.o.map((n,i)=>[n,(x.votes||{})[i]||0])}:{q:'',o:[]};refresh('poll')},bail);
let un=[];
onAuthStateChanged(au,u=>{un.forEach(f=>f());un=[];admin=!!u;
  if(u){un.push(onSnapshot(C('subs'),s=>{db.subs=s.docs.map(d=>d.data().m);refresh('subs')},()=>{}));
        un.push(onSnapshot(C('msgs'),s=>{db.msgs=s.docs.map(d=>d.data());refresh('msgs')},()=>{}))}
  else{db.subs=[];db.msgs=[]}
  refresh('auth')});
}
</script>
</body>
</html>
